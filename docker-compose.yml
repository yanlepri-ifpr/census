services:
  db:
    image: postgres:16
    container_name: census-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-census}
      POSTGRES_USER: ${POSTGRES_USER:-census}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    ports:
      - "5432:5432"
    volumes:
      - census-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  census-postgres-data:
