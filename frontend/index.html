<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Census</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
  <link href="/css/styles.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
  <header class="bg-white border-bottom">
    <div class="container py-3 d-flex align-items-center justify-content-between">
      <a class="text-decoration-none fw-bold fs-4" href="/">Census</a>
      <nav class="d-flex gap-3">
        <a href="/">Enquetes</a>
        <span id="guestLinks" class="d-flex gap-3">
          <a href="/login.html">Entrar</a>
          <a href="/register.html">Criar conta</a>
        </span>
        <span id="userLinks" class="d-none gap-3">
          <span id="userEmail" class="text-secondary small"></span>
          <a href="#" id="logoutLink">Sair</a>
        </span>
      </nav>
    </div>
  </header>
  <main class="container py-5">
    <div id="listAlert" class="alert d-none"></div>
    <div class="d-flex align-items-center justify-content-between mb-4">
      <h1 class="h1 mb-0">Enquetes</h1>
      <span id="newPollAction" class="d-none">
        <button type="button" id="newPollButton" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#pollModal">Nova enquete</button>
      </span>
    </div>
    <div id="poll-list" class="row g-4">
      <div class="col-12">Carregando enquetes...</div>
    </div>
  </main>
  <div class="modal fade" id="pollModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="h2 modal-title">Nova enquete</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="pollFormAlert" class="alert alert-danger d-none"></div>
          <form id="pollForm" novalidate>
            <div class="mb-3">
              <input type="text" id="optionAInput" class="form-control" placeholder="Opção A" autocomplete="off" maxlength="120">
              <div id="optionAError" class="invalid-feedback"></div>
            </div>
            <div class="mb-3">
              <input type="text" id="optionBInput" class="form-control" placeholder="Opção B" autocomplete="off" maxlength="120">
              <div id="optionBError" class="invalid-feedback"></div>
            </div>
            <div class="mb-1">
              <input type="datetime-local" id="endsAtInput" class="form-control">
              <div id="endsAtError" class="invalid-feedback"></div>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" form="pollForm" id="pollSubmitButton" class="btn btn-primary">Criar enquete</button>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js" integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu" crossorigin="anonymous"></script>
  <script type="module" src="/js/polls.js"></script>
</body>
</html>
