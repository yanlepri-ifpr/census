<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Enquete - Census</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
  <link href="/css/styles.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
  <header class="bg-white border-bottom">
    <div class="container py-3 d-flex align-items-center justify-content-between">
      <a class="text-decoration-none fw-bold fs-4" href="/">Census</a>
      <nav class="d-flex gap-3">
        <a href="/">Enquetes</a>
        <span id="guestLinks" class="d-flex gap-3">
          <a href="/login.html">Entrar</a>
          <a href="/register.html">Criar conta</a>
        </span>
        <span id="userLinks" class="d-none gap-3">
          <span id="userEmail" class="text-secondary small"></span>
          <a href="#" id="logoutLink">Sair</a>
        </span>
      </nav>
    </div>
  </header>
  <main class="container py-5">
    <div class="mb-4">
      <a href="/" class="small text-decoration-none">&larr; Voltar para enquetes</a>
    </div>
    <div id="pollAlert" class="alert alert-danger alert-error d-none"></div>
    <section id="pollDetails" class="card p-4">
      <div class="text-secondary">Carregando enquete...</div>
    </section>
    <section id="managementActions" class="mt-5"></section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js" integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu" crossorigin="anonymous"></script>
  <script type="module" src="/js/poll.js"></script>
</body>
</html>
